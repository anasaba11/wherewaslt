<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhereWasIt?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EC; --surface:#FDFCF8; --surface-2:#EFEADD;
  --text:#231F1C; --text-muted:#7A736A; --border:#E4DFD2;
  --accent:#7D2E46; --accent-ink:#FDFCF8;
  --shadow:0 6px 20px rgba(35,31,28,.10);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130F; --surface:#1E1A15; --surface-2:#272019;
    --text:#F1ECE3; --text-muted:#A59C8C; --border:#332B21;
    --accent:#D9859A; --accent-ink:#1E1A15; --shadow:0 6px 20px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16130F; --surface:#1E1A15; --surface-2:#272019;
  --text:#F1ECE3; --text-muted:#A59C8C; --border:#332B21;
  --accent:#D9859A; --accent-ink:#1E1A15; --shadow:0 6px 20px rgba(0,0,0,.4);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;}
.wordmark{font-family:'Fraunces',serif;font-style:italic;font-weight:600;}
button,select,input,textarea{font-family:inherit;color:inherit;}
#app{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{width:230px;flex:none;padding:22px 16px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:22px;}
.brand{font-size:21px;}
.brand span{color:var(--accent);}
.navgroup{display:flex;flex-direction:column;gap:2px;}
.navlabel{font-size:12px;color:var(--text-muted);padding:0 10px 6px;}
.navbtn{display:flex;align-items:center;gap:9px;border:none;background:none;text-align:left;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:14.5px;color:var(--text);}
.navbtn:hover{background:var(--surface-2);}
.navbtn.active{background:var(--surface-2);font-weight:600;}
.navbtn .count{margin-left:auto;color:var(--text-muted);font-size:12.5px;}
.coll-row{display:flex;align-items:center;gap:6px;}
.coll-row .navbtn{flex:1;}
.coll-add{display:flex;gap:6px;padding:2px 10px;}
.coll-add input{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13.5px;}
.coll-add button{border:none;background:var(--surface-2);border-radius:8px;padding:6px 10px;cursor:pointer;}

/* Main */
main{flex:1;min-width:0;padding:22px 28px 60px;}
.topbar{display:flex;flex-direction:column;gap:10px;max-width:760px;margin-bottom:26px;}
.search-wrap input,.capture-wrap input{width:100%;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:13px 16px;font-size:15px;outline:none;}
.search-wrap input:focus,.capture-wrap input:focus{border-color:var(--accent);}
.capture-wrap{position:relative;}
.hint{font-size:12.5px;color:var(--text-muted);padding:0 4px;}
.dup-banner{display:none;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13.5px;}
.dup-banner.show{display:flex;}
.dup-banner button{border:none;background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:5px 10px;font-size:13px;cursor:pointer;}
.dup-banner .ghost{background:none;color:var(--text-muted);text-decoration:underline;cursor:pointer;}

.view-head{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;}
.view-head h1{font-size:19px;margin:0;font-weight:600;}
.view-head .sub{color:var(--text-muted);font-size:13.5px;}
.view-head .spacer{flex:1;}
.view-head button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;}

.group-label{font-size:12.5px;color:var(--text-muted);margin:18px 2px 10px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px;}
.card.flash{animation:flash 1.1s ease;}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--accent);}100%{box-shadow:none;}}
.card-top{display:flex;align-items:center;gap:9px;}
.avatar{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-muted);flex:none;}
.domain{font-size:12.5px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-top .spacer{flex:1;}
.iconbtn{border:none;background:none;cursor:pointer;font-size:15px;padding:2px;color:var(--text-muted);line-height:1;}
.iconbtn.fav.on{color:var(--accent);}
.title{font-size:15px;font-weight:600;line-height:1.35;}
.title a{color:inherit;text-decoration:none;}
.title a:hover{text-decoration:underline;}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.catselect,.collselect{border:none;background:var(--surface-2);border-radius:999px;padding:4px 9px;font-size:12px;cursor:pointer;}
.tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px 4px 3px 9px;font-size:12px;color:var(--text-muted);}
.tag button{border:none;background:none;cursor:pointer;color:var(--text-muted);font-size:12px;padding:1px 5px;}
.addtag{font-size:12px;border:1px dashed var(--border);background:none;border-radius:999px;padding:3px 9px;cursor:pointer;color:var(--text-muted);}
.addtag input{border:none;background:none;outline:none;width:70px;font-size:12px;}
details.note{font-size:12.5px;}
details.note summary{color:var(--text-muted);cursor:pointer;list-style:none;}
details.note summary::-webkit-details-marker{display:none;}
details.note textarea{width:100%;margin-top:6px;border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:8px;font-size:13px;resize:vertical;min-height:44px;outline:none;}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:2px;}
.card-foot .date{font-size:11.5px;color:var(--text-muted);}
.card-foot .spacer{flex:1;}

.empty{padding:60px 10px;text-align:center;color:var(--text-muted);}
.empty h2{color:var(--text);font-family:'Fraunces',serif;font-weight:500;font-size:20px;margin:0 0 6px;}
.empty button{margin-top:14px;border:none;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:10px 16px;font-size:14px;cursor:pointer;}

.bottom-nav{display:none;}

@media (max-width:760px){
  #app{flex-direction:column;}
  .sidebar{display:none;}
  .bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));gap:4px;overflow-x:auto;z-index:5;}
  .bottom-nav button{flex:none;border:none;background:none;font-size:12.5px;color:var(--text-muted);padding:6px 11px;border-radius:9px;white-space:nowrap;}
  .bottom-nav button.active{background:var(--surface-2);color:var(--text);font-weight:600;}
  main{padding:18px 16px 90px;}
  .grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand wordmark">Where<span>Was</span>It?</div>
    <div class="navgroup" id="navMain"></div>
    <div class="navgroup">
      <div class="navlabel">Collections</div>
      <div id="navColls"></div>
      <div class="coll-add">
        <input id="newCollInput" placeholder="New collection…">
        <button id="newCollBtn">Add</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="search-wrap"><input id="searchInput" placeholder="What are you looking for?"></div>
      <div class="capture-wrap">
        <input id="captureInput" placeholder="Paste a link or write a note…">
      </div>
      <div class="hint" id="hintText">Press Enter to save · e.g. “that Python tutorial”, “the headphones I wanted”</div>
      <div class="dup-banner" id="dupBanner"></div>
    </div>

    <div class="view-head">
      <h1 id="viewTitle">All memories</h1>
      <span class="sub" id="viewSub"></span>
      <span class="spacer"></span>
      <button id="viewAction" style="display:none;"></button>
    </div>

    <div id="results"></div>
  </main>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<script>
const CATS = ['📁 Other','💻 Programming','📚 Learning','🛒 Shopping','🍳 Recipes','✈️ Travel','🎬 Entertainment','🎨 Inspiration','🛠 Tools','💼 Work','❤️ Personal'];
const STOP = new Set(['this','that','with','from','your','have','what','about','there','their','which','best','the','and','for','are','you','how','top','did','was','were','save','saved','saving','just','some','like','into','than','then','them','when','where']);
let state = {items:[], collections:[], view:{type:'all', collId:null}, query:''};

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(36).slice(2)); }

function load(){
  try{
    const raw = localStorage.getItem('wwi_state');
    if(raw) state = Object.assign(state, JSON.parse(raw));
  }catch(e){ console.warn('load failed', e); }
}
function persist(){
  try{ localStorage.setItem('wwi_state', JSON.stringify(state)); }
  catch(e){ console.warn('save failed', e); }
}

function guessCategory(text){
  const t = text.toLowerCase();
  const rules = [
    [/github|gitlab|stackoverflow|codepen|npm|devdocs/, '💻 Programming'],
    [/recipe|cook|ingredient|allrecipes|bake|kitchen/, '🍳 Recipes'],
    [/amazon|etsy|ebay|shop|price|buy|\$\d|product/, '🛒 Shopping'],
    [/udemy|coursera|tutorial|course|learn|khanacademy|lesson/, '📚 Learning'],
    [/booking|airbnb|tripadvisor|flight|hotel|itinerary|trip/, '✈️ Travel'],
    [/netflix|imdb|movie|episode|trailer|show/, '🎬 Entertainment'],
    [/dribbble|behance|pinterest|inspiration|moodboard/, '🎨 Inspiration'],
    [/docs\.|notion\.so|figma|tool|utility|app\./, '🛠 Tools'],
    [/meeting|deadline|project|client|work|report/, '💼 Work'],
  ];
  for(const [re,cat] of rules) if(re.test(t)) return cat;
  return '📁 Other';
}
function extractTags(text){
  const words = (text.toLowerCase().match(/[a-z0-9]+/g) || []);
  const seen = new Set(); const tags = [];
  for(const w of words){
    if(w.length>3 && !STOP.has(w) && !seen.has(w)){
      seen.add(w); tags.push(w[0].toUpperCase()+w.slice(1));
      if(tags.length>=4) break;
    }
  }
  return tags;
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  const m=Math.floor(s/60); if(m<60) return m+'m ago';
  const h=Math.floor(m/60); if(h<24) return h+'h ago';
  const d=Math.floor(h/24); if(d<30) return d+'d ago';
  return Math.floor(d/30)+'mo ago';
}
function dateLabel(ts){
  const d = new Date(ts), now = new Date();
  const days = Math.floor((new Date(now.toDateString())-new Date(d.toDateString()))/86400000);
  if(days===0) return 'Today';
  if(days===1) return 'Yesterday';
  if(days<7) return 'This week';
  return 'Earlier';
}

function parseInput(raw){
  const m = raw.match(/^(https?:\/\/[^\s]+)/i);
  if(m){
    const url = m[1];
    let domain=''; try{ domain = new URL(url).hostname.replace(/^www\./,''); }catch(e){}
    const rest = raw.slice(m[0].length).trim();
    return {type:'link', url, domain, title: rest || domain || url, note:''};
  }
  return {type:'note', url:'', domain:'', title: raw.length>70 ? raw.slice(0,70)+'…' : raw, note: raw};
}
let pending = null;
function handleCapture(){
  const inp = document.getElementById('captureInput');
  const raw = inp.value.trim();
  if(!raw) return;
  const parsed = parseInput(raw);
  if(parsed.type==='link'){
    const dup = state.items.find(i=>!i.deletedAt && i.url===parsed.url);
    if(dup){ pending = parsed; showDup(dup); return; }
  }
  commit(parsed);
  inp.value='';
}
function showDup(dup){
  const b = document.getElementById('dupBanner');
  b.innerHTML = 'You already saved <b>'+esc(dup.title)+'</b> ('+timeAgo(dup.createdAt)+'). ';
  const anyway = document.createElement('button'); anyway.textContent='Save anyway';
  anyway.onclick = ()=>{ commit(pending); pending=null; hideDup(); document.getElementById('captureInput').value=''; };
  const cancel = document.createElement('button'); cancel.className='ghost'; cancel.textContent='Cancel';
  cancel.onclick = ()=>{ pending=null; hideDup(); };
  b.appendChild(anyway); b.appendChild(cancel);
  b.classList.add('show');
}
function hideDup(){ document.getElementById('dupBanner').classList.remove('show'); }

function commit(parsed){
  const basis = parsed.title+' '+parsed.note+' '+parsed.domain;
  const item = Object.assign({id:uid(), tags:extractTags(basis), category:guessCategory(basis), collId:null, favorite:false, createdAt:Date.now(), deletedAt:null}, parsed);
  state.items.unshift(item);
  persist(); render();
  requestAnimationFrame(()=>{
    const el = document.querySelector('[data-id="'+item.id+'"]');
    if(el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),1100); }
  });
}

function toggleFav(id){ const it=state.items.find(i=>i.id===id); if(it){ it.favorite=!it.favorite; persist(); render(); } }
function softDelete(id){ const it=state.items.find(i=>i.id===id); if(it){ it.deletedAt=Date.now(); persist(); render(); } }
function restore(id){ const it=state.items.find(i=>i.id===id); if(it){ it.deletedAt=null; persist(); render(); } }
function hardDelete(id){ state.items = state.items.filter(i=>i.id!==id); persist(); render(); }
function emptyTrash(){ state.items = state.items.filter(i=>!i.deletedAt); persist(); render(); }
function setCategory(id,val){ const it=state.items.find(i=>i.id===id); if(it){ it.category=val; persist(); } }
function setCollection(id,val){ const it=state.items.find(i=>i.id===id); if(it){ it.collId = val||null; persist(); render(); } }
function removeTag(id,tag){ const it=state.items.find(i=>i.id===id); if(it){ it.tags=it.tags.filter(t=>t!==tag); persist(); render(); } }
function addTag(id,tag){ tag=tag.trim(); if(!tag) return; const it=state.items.find(i=>i.id===id); if(it && !it.tags.includes(tag)){ it.tags.push(tag); persist(); render(); } }
function setNote(id,val){ const it=state.items.find(i=>i.id===id); if(it){ it.note=val; persist(); } }
function addCollection(name){
  name=name.trim(); if(!name) return;
  state.collections.push({id:uid(), name});
  persist(); render();
}

function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function matches(item,q){
  if(!q) return true;
  const hay = [item.title,item.note,item.domain,item.category,...(item.tags||[])].join(' ').toLowerCase();
  const words = q.toLowerCase().match(/[a-z0-9]+/g) || [];
  const useful = words.filter(w=>w.length>1 && !STOP.has(w));
  const list = useful.length ? useful : words;
  return list.some(w=>hay.includes(w));
}

function filteredItems(){
  const v = state.view;
  return state.items.filter(i=>{
    if(v.type==='trash') return !!i.deletedAt;
    if(i.deletedAt) return false;
    if(v.type==='favorites') return i.favorite;
    if(v.type==='collection') return i.collId===v.collId;
    return true;
  }).filter(i=>matches(i,state.query));
}

function renderNav(){
  const counts = {
    all: state.items.filter(i=>!i.deletedAt).length,
    favorites: state.items.filter(i=>!i.deletedAt && i.favorite).length,
    trash: state.items.filter(i=>i.deletedAt).length
  };
  const mainItems = [['all','🏠 All memories',counts.all],['favorites','⭐ Favorites',counts.favorites],['trash','🗑 Trash',counts.trash]];
  const navMain = document.getElementById('navMain');
  navMain.innerHTML='';
  mainItems.forEach(([type,label,count])=>{
    const b=document.createElement('button');
    b.className='navbtn'+(state.view.type===type?' active':'');
    b.innerHTML = '<span>'+label+'</span><span class="count">'+count+'</span>';
    b.onclick=()=>{ state.view={type,collId:null}; render(); };
    navMain.appendChild(b);
  });
  const navColls = document.getElementById('navColls');
  navColls.innerHTML='';
  state.collections.forEach(c=>{
    const n = state.items.filter(i=>!i.deletedAt && i.collId===c.id).length;
    const row=document.createElement('div'); row.className='coll-row';
    const b=document.createElement('button');
    b.className='navbtn'+(state.view.type==='collection'&&state.view.collId===c.id?' active':'');
    b.innerHTML='<span>🗂 '+esc(c.name)+'</span><span class="count">'+n+'</span>';
    b.onclick=()=>{ state.view={type:'collection',collId:c.id}; render(); };
    row.appendChild(b); navColls.appendChild(row);
  });
  const bn = document.getElementById('bottomNav');
  bn.innerHTML='';
  mainItems.forEach(([type,label])=>{
    const b=document.createElement('button');
    b.className=state.view.type===type?'active':'';
    b.textContent=label.replace(/^\S+\s/,'');
    b.onclick=()=>{ state.view={type,collId:null}; render(); };
    bn.appendChild(b);
  });
  state.collections.forEach(c=>{
    const b=document.createElement('button');
    b.className=(state.view.type==='collection'&&state.view.collId===c.id)?'active':'';
    b.textContent=c.name;
    b.onclick=()=>{ state.view={type:'collection',collId:c.id}; render(); };
    bn.appendChild(b);
  });
}

function emptyMessage(){
  if(state.query) return {title:'Nothing found', body:'Try different words — search also looks at tags, notes, and category.'};
  const v = state.view.type;
  if(v==='favorites') return {title:'Nothing here yet', body:'Favorite the things you never want to lose.'};
  if(v==='trash') return {title:'Trash is empty', body:'Deleted memories will show up here.'};
  if(v==='collection') return {title:'Nothing in this collection yet', body:'Assign a memory to it from its card.'};
  return {title:'Your memory is empty', body:"Save something above and you'll never have to wonder where it went again."};
}

function cardHTML(it){
  const letter = (it.domain || it.title || '?')[0].toUpperCase();
  const titleHTML = it.type==='link'
    ? '<a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a>'
    : esc(it.title);
  const inTrash = !!it.deletedAt;
  const collOpts = ['<option value="">No collection</option>'].concat(
    state.collections.map(c=>'<option value="'+c.id+'"'+(it.collId===c.id?' selected':'')+'>'+esc(c.name)+'</option>')
  ).join('');
  const catOpts = CATS.map(c=>'<option'+(it.category===c?' selected':'')+'>'+c+'</option>').join('');
  return '<div class="card" data-id="'+it.id+'">'
    + '<div class="card-top"><div class="avatar">'+letter+'</div>'
    + '<div class="domain">'+(it.domain||(it.type==='note'?'Note':''))+'</div><div class="spacer"></div>'
    + (!inTrash ? '<button class="iconbtn fav'+(it.favorite?' on':'')+'" onclick="toggleFav(\''+it.id+'\')">'+(it.favorite?'★':'☆')+'</button>' : '')
    + '</div>'
    + '<div class="title">'+titleHTML+'</div>'
    + '<div class="meta-row">'
    + '<select class="catselect" onchange="setCategory(\''+it.id+'\',this.value)">'+catOpts+'</select>'
    + '<select class="collselect" onchange="setCollection(\''+it.id+'\',this.value)">'+collOpts+'</select>'
    + '</div>'
    + '<div class="tags">'
    + it.tags.map(t=>'<span class="tag">'+esc(t)+'<button onclick="removeTag(\''+it.id+'\',\''+esc(t).replace(/'/g,"\\'")+'\')">×</button></span>').join('')
    + '<button class="addtag" onclick="this.outerHTML=\'<span class=&quot;tag&quot;><input autofocus placeholder=&quot;tag&quot; onkeydown=&quot;if(event.key===&apos;Enter&apos;){addTag(&apos;'+it.id+'&apos;,this.value);}&quot;></span>\'">+ tag</button>'
    + '</div>'
    + '<details class="note"><summary>'+(it.note?'Note: '+esc(it.note.slice(0,40))+(it.note.length>40?'…':''):'Why did I save this?')+'</summary>'
    + '<textarea onblur="setNote(\''+it.id+'\',this.value)" placeholder="Add a note…">'+esc(it.note||'')+'</textarea></details>'
    + '<div class="card-foot"><span class="date">'+timeAgo(it.createdAt)+'</span><span class="spacer"></span>'
    + (inTrash
        ? '<button class="iconbtn" title="Restore" onclick="restore(\''+it.id+'\')">↺ Restore</button><button class="iconbtn" title="Delete forever" onclick="hardDelete(\''+it.id+'\')">Delete forever</button>'
        : '<button class="iconbtn" title="Delete" onclick="softDelete(\''+it.id+'\')">🗑</button>')
    + '</div></div>';
}

function render(){
  renderNav();
  const titleMap = {all:'All memories', favorites:'Favorites', trash:'Trash'};
  const vt = state.view.type;
  document.getElementById('viewTitle').textContent = vt==='collection'
    ? (state.collections.find(c=>c.id===state.view.collId)?.name || 'Collection')
    : titleMap[vt];
  const items = filteredItems();
  document.getElementById('viewSub').textContent = items.length ? items.length+(items.length===1?' memory':' memories') : '';
  const actionBtn = document.getElementById('viewAction');
  if(vt==='trash' && items.length){ actionBtn.style.display='inline-block'; actionBtn.textContent='Empty trash'; actionBtn.onclick=emptyTrash; }
  else actionBtn.style.display='none';

  const results = document.getElementById('results');
  if(!items.length){
    const m = emptyMessage();
    results.innerHTML = '<div class="empty"><h2>'+m.title+'</h2><p>'+m.body+'</p>'
      + (vt==='all' && !state.query ? '<button onclick="document.getElementById(\'captureInput\').focus()">Save your first memory</button>' : '')
      + '</div>';
    return;
  }
  if(vt==='all' && !state.query){
    const groups = {'Today':[],'Yesterday':[],'This week':[],'Earlier':[]};
    items.forEach(i=>groups[dateLabel(i.createdAt)].push(i));
    let html='';
    for(const g of ['Today','Yesterday','This week','Earlier']){
      if(groups[g].length){ html += '<div class="group-label">'+g+'</div><div class="grid">'+groups[g].map(cardHTML).join('')+'</div>'; }
    }
    results.innerHTML = html;
  } else {
    results.innerHTML = '<div class="grid">'+items.map(cardHTML).join('')+'</div>';
  }
}

document.getElementById('captureInput').addEventListener('keydown', e=>{ if(e.key==='Enter') handleCapture(); });
document.getElementById('searchInput').addEventListener('input', e=>{ state.query = e.target.value; render(); });
document.getElementById('newCollBtn').addEventListener('click', ()=>{
  const inp = document.getElementById('newCollInput'); addCollection(inp.value); inp.value='';
});
document.getElementById('newCollInput').addEventListener('keydown', e=>{
  if(e.key==='Enter'){ addCollection(e.target.value); e.target.value=''; }
});

load(); render();
</script>
</body>
</html>
